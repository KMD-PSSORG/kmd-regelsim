<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMD RegelSim — Konsekvenssimulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" aria-busy="true">
    <div class="loading-state" role="status">
      <p>Indlæser simuleringsmotor…</p>
    </div>
  </div>

  <script type="module">
    import { createEngine } from './bridge.js';
    import { createApp } from './app.js';

    const root = document.getElementById('app');

    if (typeof WebAssembly === 'undefined') {
      const msg = document.createElement('p');
      msg.className = 'error-state';
      msg.textContent = 'Din browser understøtter ikke WebAssembly. Brug en moderne browser.';
      root.replaceChildren(msg);
    } else {
      try {
        const engine = await createEngine();
        root.removeAttribute('aria-busy');
        createApp(root, engine);
      } catch (err) {
        const msg = document.createElement('p');
        msg.className = 'error-state';
        msg.textContent = 'Fejl ved indlæsning: ' + err.message;
        root.replaceChildren(msg);
        console.error(err);
      }
    }
  </script>
</body>
</html>
